<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetVista – {% block title %}Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ── SIDEBAR ─────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🐾</span>
      <span class="logo-text">PetVista</span>
    </div>

    <nav class="sidebar-nav">
      <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <a href="{{ url_for('products') }}" class="nav-item {% if 'product' in (request.endpoint or '') %}active{% endif %}">
        <span class="nav-icon">📦</span> Products
      </a>
      <a href="{{ url_for('sell') }}" class="nav-item {% if request.endpoint == 'sell' %}active{% endif %}">
        <span class="nav-icon">🛒</span> Sell
      </a>
      <a href="{{ url_for('sales') }}" class="nav-item {% if request.endpoint == 'sales' %}active{% endif %}">
        <span class="nav-icon">📊</span> Sales History
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="pet-mascot">🐶</div>
      <p>Your pets deserve<br/>the best!</p>
    </div>
  </aside>

  <!-- ── MAIN ────────────────────────────────────────── -->
  <main class="main-content">
    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
