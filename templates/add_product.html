{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h2 class="page-title">➕ Add Product</h2>
    <p class="page-sub">Add a new item to your inventory</p>
  </div>
  <a href="{{ url_for('products') }}" class="btn btn-ghost">← Back</a>
</div>

<div class="form-card">
  <form method="POST" class="pet-form">
    <div class="form-grid">
      <div class="form-group">
        <label>Product ID</label>
        <input type="number" name="pid" placeholder="e.g. 101" required class="form-input" />
      </div>
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" name="name" placeholder="e.g. Royal Canin Adult" required class="form-input" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select name="category" required class="form-input">
          <option value="" disabled selected>Select category</option>
          <option>Food</option>
          <option>Grooming</option>
          <option>Toys</option>
          <option>Medicine</option>
          <option>Accessories</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price (₹)</label>
        <input type="number" name="price" step="0.01" placeholder="0.00" required class="form-input" />
      </div>
      <div class="form-group form-full">
        <label>Quantity in Stock</label>
        <input type="number" name="quantity" placeholder="e.g. 50" required class="form-input" />
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-lg">Save Product 🐾</button>
  </form>
</div>

{% endblock %}
